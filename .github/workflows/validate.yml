name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Open English Wordnet
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          path: external/english-wordnet
          depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate data/*.yaml
        run: uv run semcor-validate
