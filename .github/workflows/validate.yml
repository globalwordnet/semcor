name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Open English Wordnet
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          path: external/english-wordnet
          depth: 1

      - name: Checkout Open English Namenet
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-namenet
          path: external/english-namenet
          depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate data/*.yaml
        run: uv run semcor-validate

  # A separate job (not a later step in `validate`) so a failure there --
  # e.g. an oewn_key drifting out of sync with upstream Open English
  # Wordnet -- can't silently skip this and hide a real tokens/text
  # regression behind an unrelated one.
  check-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check token positions haven't drifted
        run: uv run semcor-check-tokens
