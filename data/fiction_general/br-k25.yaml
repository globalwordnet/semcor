    text: 'He had lived for almost thirty years in this same stone farmhouse with the same
  wife, a remarkably childish thing in itself; he rose at half past six every morning,
  made himself some French coffee, had his corn_flakes and more coffee, smoked four
  cigarettes while reading last Sunday''s Herald_Tribune and yesterday''s Pittsburgh_Gazette,
  then put_on his high-topped farmer''s shoes and walked under a vine bower to his
