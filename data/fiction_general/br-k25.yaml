    text: 'She stood_up, smoothing her hair down, straightening her clothes, feeling a thankfulness
  for the enveloping darkness outside, and, above everything else, for the absence
  of the need to answer, to respond, to be aware even of Stowey coming_in or going_out,
  and yet, now that she was beginning to cook, she glimpsed a future without him,
  a future alone like this, and the pain made her head writhe, and in_a_moment she
  found it hard to wait for Lucretia to come with her guests.'
