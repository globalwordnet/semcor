    text: 'He could no_longer build anything, whether a private residence in his Pennsylvania
  county or a church in Brazil, without it being obvious that he had done it, and
  while here_and_there he was taken_to_task for again developing the same airy technique,
  they were such fanciful and sometimes even playful buildings that the public felt
  assured by its sense of recognition after a time, a quality of authentic uniqueness
  about them, which, once established by an artist as his private vision, is no_longer
  disputable as to its other values.'
