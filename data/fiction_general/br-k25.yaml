    text: 'But just when she seemed to have sunk into some depravity of peasanthood she would
  disappear and come_down bathed, brushed, and taking_breaths of air, and even with
  her broken nails her hands would come to rest on a table or a leaf with a thoughtless
  delicacy, a grace of history, so_to_speak, and for an instant one saw how ferociously
  proud she was and adamant on certain questions of personal value.'
