    text: 'Now she could let out the three parakeets without_fear they would be stepped_on
  or that Stowey would let them out one of the doors; she could dust the plants, then
  break_off suddenly and pick_up an old novel and read from the middle on; improvise
  cha-chas on the harp; and finally, the best part of all, simply sit at the plank
  table in the kitchen with a bottle of wine and the newspapers, reading the ads as_well_as
  the news, registering nothing on her mind but letting her soul suspend itself above
  all wishing and desire.'
