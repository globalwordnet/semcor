    text: 'So you sit in the car and listen to the air run_out and listen to the rain and see
  the mud in_front_of the headlights, waiting for you, for your new spectator_pumps,
  waiting for you to squat by yourself out there in your tight skirt, crying and afraid
  and trying to get that damned son-of-a-bitch tire off, because that is being an
  old_maid too, if you happen to drive a car, it is changing the tire yourself in
  the night, and in the mud and the rain, hating to get out in it but afraid to stay
  and afraid to try to walk out for help.'
