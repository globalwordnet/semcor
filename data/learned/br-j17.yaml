    text: 'In_view_of the important role which emotional_disturbances play in the genesis of
  neurotic and psychotic disorders and the parallelism observed between autonomic
  states and psychological behavior in several instances, it is further suggested
  that a hypothalamic imbalance may play an important role in initiating mental changes.

