    text: 'generous public provision for the infirm; democratic and secret elections of all
  officers including priests, meals taken publicly in common refectories; a common
  habit or uniform prescribed for all citizens; even houses changed once a decade;
  six hours of manual_labor a day for all but a handful of magistrates and scholars,
  and careful measures to prevent anyone from shirking; no private_property, no money;
