    text: ' In the Analytical phase of their Cubism, Braque and Picasso had not_only had to
  minimize three-dimensionality simply in_order to preserve it; they had also had
  to generalize it - to the point, finally, where the illusion of depth and relief
  became abstracted from specific three-dimensional entities and was rendered largely
  as the illusion of depth and relief as_such: as a disembodied attribute and expropriated
  property detached from everything not itself.'
