    text: 'For_example, one hebephrenic man used_to annoy me, month after month, by saying,
  whenever I got_up to leave and made my fairly steoreotyped comment that I would
  be seeing him on the following day, or whenever, " You''re welcome ", in a notably
  condescending fashion - as though it were his due for me to thank him for the privilege
  of spending the hour with him, and he were thus pointing_up my failure to utter
  a humbly grateful, " thank_you " to him at the end of each session.'
