    text: 'To a much less full extent, the hebephrenic person''s belching or flatus has a comparable
  communicative function; in working with these patients the therapist eventually
  gets to do some at_least private mulling over of the possible meaning of a belch,
  or the passage of flatus, not_only because he is reduced to this for lack of anything
  else to analyze, but also because he learns that even these animal like sounds constitute
  forms of communication in which, from_time_to_time, quite different things are being
  said, long before the patient can become sufficiently aware of these, as distinct
  feelings and concepts, to say them in words.

