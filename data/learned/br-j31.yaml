    text: 'Eventually it became clear to me, partly with the aid of another schizophrenic patient who could point_out my condescension to me somewhat more directly, that this man, with his condescending, "You''re welcome", was very accurately personifying an element of obnoxious condescension which had been present in my own demeanor, over these months, on each of these occasions when I had bid him good-bye with the consoling note, each time, that the healing Christ would be stooping_to dispense this succor to the poor suffered again on the morrow.

  '
