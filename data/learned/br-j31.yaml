    text: 'As I have been intimating, in the schizophrenic - and perhaps also in the dreams
  of the neurotic; this is a question which I have no wish to take_up - condensation
  is a phenomenon in which one finds not a condensed expression of various feelings
  and ideas which are, at an unconscious level, well sorted_out, but rather a condensed
  expression of feelings and ideas which, even in the unconscious, have yet to become
  well differentiated from one another.'
