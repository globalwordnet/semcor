    text: 'It is no coincidence that the hebephrenic patient, the most severely dedifferentiated
  of all schizophrenic patients, shows, as one of his characteristic symptoms, laughter
  - laughter which now makes one feel scorned or hated, which now makes one feel_like
  weeping, or which now gives one a glimpse of the bleak and empty expanse of man''s
  despair; and which, more often than all these, conveys a welter of feelings which
  could in_no_way be conveyed by any number of words, words which are so unlike this
  welter in being formed and discrete from one another.'
