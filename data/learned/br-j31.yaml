    text: 'This behavior on her part subsided only after I had come to see the uncomfortably
  close similarity between, on_the_one_hand, her arranging the ventilation of the
  common living_room to her own liking, or turning the television off or on without
  regard_to the wishes of the others, and on_the_other_hand, my own coming stolidly
  into her room despite her persistent and vociferous objections, bringing my big
  easy_chair with me, usually shutting the windows of her room which she preferred
  to keep in a very cold state, and plunking myself down in my chair - in_short, behaving
  as if I owned her room.

  '
