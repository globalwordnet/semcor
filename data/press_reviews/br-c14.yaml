    text: 'The " Suite of Old_Russian Dances " that opened that inaugural program with the
  slow and modest entrance of the maidens and built steadily into typical Moiseyev
  vigor and warmth; the amusing " Yurochka ", in_which a hard-to-please young_man
  is given his come-uppance; the lovely (and of_course vigorous) " Polyanka " or "
  The Meadow "; the three Moldavian dances entitled " Zhok "; the sweet and funny
  little dance about potato planting called " Bul'' ba "; and the hilarious picture
  of social life in an earlier day called " City_Quadrille " are all just_as good
  as one remembers them to have been, and they are welcome back.

