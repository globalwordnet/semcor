    text: ' It argued, inter_alia, that a divestiture order would severely depress the market_value
  of the stock of both General_Motors and du_Pont, with consequent serious loss and
  hardship to hundreds of thousands of innocent investors, among them thousands of
  small trusts and charitable institutions; that there would be a similar decline
  in the market_values of other automotive and chemical stocks, with similar losses
  to the stockholders of those companies; that the tremendous volume of General_Motors
  stock hanging over the market for ten years would hamper the efforts of General_Motors
  and other automobile manufacturers to raise equity capital; and that all this would
  have a serious adverse effect on the entire stock_market and on general business_activity.'
