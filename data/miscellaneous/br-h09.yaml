    text: 'There are authorized to be appropriated such sums, to remain available until expended, as may be necessary, but not more_than $75,000,000 in_all, (A) to carry_out the provisions of this Act during the fiscal_years 1962 to 1967, inclusive; (B) to finance, for not more_than two years beyond the end of said period, such grants, contracts, cooperative agreements, and studies as may theretofore have been undertaken pursuant to this Act; and (C) to finance, for not more_than three years beyond the end of said period, such activities as are required to correlate, coordinate, and round_out the results of studies and research undertaken pursuant to this Act: Provided, That funds available in any one year for research and development may, subject_to the approval of the Secretary_of_State to assure that such activities are consistent with the foreign_policy objectives of the United_States, be expended in_cooperation_with public or private agencies in foreign countries in the development of processes useful to the program in the United_States: And provided further, That every such contract or agreement made with any public or private agency in a foreign country shall contain provisions effective to insure that the results or information developed in connection therewith shall be available without cost to the United_States for the use of the United_States throughout the world and for the use of the general public within the United_States.

  '
