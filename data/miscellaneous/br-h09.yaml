    text: ' In_view_of the increasing shortage of usable surface and ground_water in many parts
  of the Nation and the importance of finding new sources of supply to meet its present
  and future water needs, it is the policy of the Congress to provide_for the development
  of practicable low-cost means for the large-scale production of water of a quality
  suitable for municipal, industrial, agricultural, and other beneficial consumptive
  uses from saline water, and for studies and research related thereto.'
