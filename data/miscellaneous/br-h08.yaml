    text: 'The State_Ballet of Rhode_Island, the first incorporated group, was formed for_the_purpose_of
  extending knowledge of the art of ballet in the Community, to promote interest in
  ballet performances, to contribute to the cultural life of the State, and to provide
  opportunity for gifted dance students who, for one reason or another, are unable
  to pursue a career and to develop others for the professional state; And now, therefore,
  do I, John_A._Notte, Jr., Governor of the State of Rhode_Island and Providence Plantations,
  proclaim the week of Monday, November 13, 1961, as the State_Ballet of Rhode_Island
  Week, requesting all Rhode_Islanders to give special attention to this unusual event
  which should contribute to the cultural life of the State.

  '
