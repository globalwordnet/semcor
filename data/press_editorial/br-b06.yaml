    text: 'Gov._John_M._Dalton, himself a lawyer and a man of long service in government, spoke
  with rich background and experience when he said in an address here that lawyers
  ought to quit sitting in the Missouri General_Assembly, or quit accepting fees from
  individuals and corporations who have controversies with or axes_to_grind with the
  government and who are retained, not because of their legal talents, but because
  of their government influence.

