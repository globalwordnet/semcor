    text: ' Pale yellow snapdragons that by pinching could be made to bite; seed-pods of the
  balsams that snapped like fire-crackers at a touch; red and yellow columbines whose
  round tipped spurs were picked_off and eaten for the honey in them; morning-glory
  buds which could be so grasped and squeezed that they burst like a blown-up paper_bag;
  bright flowers from the trumpet_vine that made " gloves " on the ends of ten waggling
  fingers.'
