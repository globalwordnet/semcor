    text: ' Other flowers we might gather as we pleased: myrtle and white_violets from beneath
  the lilacs; the lilacs themselves, that bloomed so prodigally but for_the_most_part
  beyond our reach; snowballs; hollyhock blossoms that, turned upside_down, make pink
  petticoated ladies; and the little, dark_blue larkspur that scattered its seed everywhere.

  '
