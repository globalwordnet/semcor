    text: 'Others who wrote_of low characters and low life included Thomas_Bangs_Thorpe, creator
  of the Big_Bear of Arkansas and Tom_Owen, the Bee-Hunter; Johnson_Jones_Hooper,
  whose character Simon_Suggs bears a close kinship to Flem_Snopes in both his willingness
  to take cruel advantage of all and sundry and the sharpness with which he habitually
  carried_out his will; and George_Washington_Harris, whose Tennessee hillbilly character
  Sut_Lovingood perpetrated more unmalicious mischief and more unintended pain than
  any other character in literature.'
