    text: 'This included Mamma, jolly, generous, and pretty, with whom they all fell_in_love,
  just as Papa had first fallen_in_love with her Mamma before he chose her; and when
  a young_man like Morris_Jastrow had enjoyed the Szold hospitality, he felt obliged
  to send his respects and his gifts not merely to Henrietta, in whom he was really
  interested, but to all the Szold girls and Mamma.'
