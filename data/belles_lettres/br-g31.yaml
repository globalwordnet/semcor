    text: 'Besides, Miss_Henrietta - as she was generally known since she had put up her hair
  with a chignon in the back - had little time to spare them from her teaching and
  writing; so Cyrus_Adler became interested in her friend Racie_Friedenwald, and Joe_Jastrow
  - the only young_man who when he wrote had the temerity to address her as Henrietta,
  and signed himself Joe - fell_in_love with pretty sister Rachel.

  '
