    text: 'Into the texture of this tapestry of history and human drama Henrietta, as every
  artist delights to do, wove strands of her own intuitive insights into human nature
  and - especially in the remarkable story of the attraction and conflict between
  two so disparate and fervent characters as this pair - into the relations of men
  and women: " In their relations, she was the giver and he the receiver, nay the
  demander.'
