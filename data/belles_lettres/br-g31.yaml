    text: 'Henrietta, however, was at that time engaged in a lengthy correspondence with Joe''s
  older and more serious brother, Morris, who was just_about her own age and whom
  she had got to know well during trips to Philadelphia with Papa, when he substituted
  for Rabbi_Jastrow at Rodeph_Shalom_Temple there during its Rabbi''s absence in Europe.'
