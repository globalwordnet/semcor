    text: 'She could not resist the opportunity " of showing her superiority in argument over
  a man " which she had remarked as one of the " feminine follies " of Sara_Sullam;
  and in her forthright way, Henrietta, who in her story of Sara had indicated her
  own unwillingness " to think_of men as the privileged " and " women as submissive
  and yielding ", felt obliged to defend vigorously any statement of hers to which
  Morris_Jastrow took the slightest exception - he objected to her stand on the Corbin
  affair, as_well_as on the radical reforms of Dr._Wise of Hebrew_Union_College -
  until once, in sheer desperation, he wrote that he had given_up hope they would
  ever agree on anything.'
