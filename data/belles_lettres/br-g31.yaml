    text: 'And just as "Laurie" Lawrence was first attracted to bright Jo_March, who found him immature by her high standards, and_then had to content himself with her younger sister Amy, so Joe_Jastrow, who had also been writing Henrietta before he came to Johns_Hopkins, had_to content himself with her younger sister, pretty Rachel.'
