    text: 'The Szolds, like the Marches, enjoyed and loved living together, even in troubled
  times; and, as in the March home, any young_man who called on the Szolds found himself
  confronted with a phalanx of femininity which made it rather difficult to direct
  his particular attention to any one of them.'
