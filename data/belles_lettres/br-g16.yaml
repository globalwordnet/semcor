    text: 'Whitehead contends that the human way of understanding existence as a unity of interlocking
  and interdependent processes which constitute each_other and which cause each_other
  to be and not to be is possible only because the basic form of such an understanding,
  for all its vagueness and tendency to mistake the detail, is initially given in
  the way man feels the world.'
