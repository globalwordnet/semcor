    text: 'Thoroughly modern in treatment, they are at_the_same_time, full of simple sincerity
  which invariably characterizes genuine Negro folk-music and are by_no_means to be
  confused with the average'' Broadway Spirituals'' which depend for their racial
  flavor upon sundry allusions to the'' Amen_Corner'','' judgement_day'','' Gabriel''s
  horn'', and a frustrated devil - with a_few random'' Hallelujahs'' thrown_in for_good_measure.

  '
