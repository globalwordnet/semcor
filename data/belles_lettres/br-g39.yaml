    text: 'The Negro composer Hall_Johnson studied the Americanegro_Suite and said of it, "
  Of all the many songs written by white composers and employing what claims to be
  a Negroid idiom in both words and music, these six songs by Harold_Arlen and Ted_Koehler
  easily stand far out above the rest.'
